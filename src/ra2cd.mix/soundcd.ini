[SoundList]
0=PartyInvite
1=ReadyCheck
2=PartyFormed
3=RadTrooperSelect
4=RadTrooperMove
5=RadTrooperDie

[PartyInvite]
Sounds=$itansee
Volume=90

[ReadyCheck]
Sounds=$itansee
Volume=90

[PartyFormed]
Sounds=icraatta
Volume=70

# Voice banks for the Rad Trooper. Select and move lines are custom;
# the death sounds reuse the Desolator's.
[RadTrooperSelect]
Control=random
Sounds=$irtrsea $irtrseb $irtrsec $irtrsed $irtrsee

[RadTrooperMove]
Control=random
Sounds=$irtrmoa $irtrmob $irtrmoc $irtrmod $irtrmoe

[RadTrooperDie]
Control=random
Sounds=idesdia idesdib idesdic
